name: NewFlasher CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux native build + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format-18 \
            pkg-config \
            libexpat1-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            shellcheck

      - name: Check formatting and shell scripts
        run: |
          clang-format-18 --dry-run --Werror \
            sony_product_code.c \
            sony_product_code.h \
            sony_product_code_catalog.inc \
            sony_product_code_families.inc \
            newflasher_spc_integration.inc \
            tests/test_sony_product_code.c \
            tests/mock_newflasher_compile.c
          shellcheck tests/run_tests.sh

      - name: Build native NewFlasher
        run: make -j"$(nproc)" newflasher

      - name: Run Product Code tests
        run: ./tests/run_tests.sh

      - name: Inspect binary
        run: |
          file newflasher
          ldd newflasher || true

      - name: Package Linux binary
        run: |
          tar -czf newflasher-linux-x86_64.tar.gz newflasher
          sha256sum newflasher-linux-x86_64.tar.gz > newflasher-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: newflasher-linux-x86_64
          path: |
            newflasher-linux-x86_64.tar.gz
            newflasher-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            mingw-w64 \
            wget \
            ca-certificates

      - name: Build Windows NewFlasher
        run: make -j2 newflasher.exe

      - name: Inspect PE binary
        run: |
          file newflasher.exe
          i686-w64-mingw32-objdump -p newflasher.exe | grep -Ei 'DLL Name:'
          i686-w64-mingw32-objdump -p newflasher.exe | grep -Eiq 'DLL Name: WINHTTP\.dll'
          i686-w64-mingw32-objdump -p newflasher.exe | grep -Eiq 'DLL Name: SETUPAPI\.dll'

      - name: Generate checksum
        run: sha256sum newflasher.exe > newflasher.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: newflasher-windows
          path: |
            newflasher.exe
            newflasher.exe.sha256
          if-no-files-found: error
