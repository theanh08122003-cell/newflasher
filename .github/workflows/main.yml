name: NewFlasher CI

on:
  workflow_dispatch:

jobs:
  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            mingw-w64 \
            wget \
            p7zip-full \
            ca-certificates

      - name: Pre-download dependencies (Fix 404 & Dead Sony Server)
        run: |
          # 1. Khắc phục lỗi 404 zlib
          wget -q https://zlib.net/fossils/zlib-1.3.1.tar.gz || wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          ln -s zlib-1.3.1 zlib 2>/dev/null || true

          # 2. Tạo giả driver GordonGate để makefile không gọi wget tới software.sonymobile.com
          touch GordonGate.7z
          cat << 'EOF' > GordonGate.h
          #ifndef GORDONGATE_H
          #define GORDONGATE_H
          static const unsigned char GordonGate[] = {0};
          static const unsigned int GordonGate_len = 0;
          #endif
          EOF

      - name: Build Windows NewFlasher
        run: make newflasher.exe

      - name: Inspect PE binary
        run: |
          file newflasher.exe
          sha256sum newflasher.exe > newflasher.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-windows
          path: |
            newflasher.exe
            newflasher.exe.sha256
          if-no-files-found: error
