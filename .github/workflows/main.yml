name: NewFlasher CI

on:
  workflow_dispatch:

jobs:
  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            mingw-w64 \
            wget \
            p7zip-full \
            ca-certificates

      - name: Patch makefile and dependencies
        run: |
          # 1. Tải zlib giải quyết lỗi 404
          wget -q https://zlib.net/fossils/zlib-1.3.1.tar.gz || wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          ln -s zlib-1.3.1 zlib 2>/dev/null || true

          # 2. Xóa lệnh tải driver Sony bị chết trong makefile
          sed -i '/software.sonymobile.com/d' makefile
          sed -i '/Sony_Mobile_Software_Update_Drivers_x64_Setup.msi/d' makefile

          # 3. Tạo sẵn GordonGate.h giả lập để trình biên dịch không gọi trích xuất driver
          cat << 'EOF' > GordonGate.h
          #ifndef GORDONGATE_H
          #define GORDONGATE_H
          static const unsigned char GordonGate[] = {0};
          static const unsigned int GordonGate_len = 0;
          #endif
          EOF

          # 4. Tạo file GordonGate.7z giả lập và cập nhật timestamp
          touch GordonGate.7z
          touch -t 203001010000 GordonGate.7z GordonGate.h

      - name: Build Windows NewFlasher
        run: make newflasher.exe

      - name: Inspect PE binary
        run: |
          file newflasher.exe
          sha256sum newflasher.exe > newflasher.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-windows
          path: |
            newflasher.exe
            newflasher.exe.sha256
          if-no-files-found: error
