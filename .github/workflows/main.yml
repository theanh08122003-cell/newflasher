name: NewFlasher CI

on:
  workflow_dispatch:

jobs:
  windows-cross:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            mingw-w64 \
            wget \
            ca-certificates

      - name: Pre-download dependencies (Fix 404 Error)
        run: |
          # Tải trước zlib từ link lưu trữ chính thức và giải nén đúng tên makefile cần
          wget -q https://zlib.net/fossils/zlib-1.3.1.tar.gz || wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          ln -s zlib-1.3.1 zlib 2>/dev/null || true

      - name: Build Windows NewFlasher
        run: make newflasher.exe

      - name: Inspect PE binary
        run: |
          file newflasher.exe
          sha256sum newflasher.exe > newflasher.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-windows
          path: |
            newflasher.exe
            newflasher.exe.sha256
          if-no-files-found: error
